name: Blog auto-merge

# The blog Routine cannot open a pull request itself: its session has no GitHub
# MCP tools and this project has no `gh` CLI. So it pushes a branch, and this
# workflow does the publish half — where `gh` is preinstalled and GITHUB_TOKEN
# is already scoped.
#
# The build runs here as well as in the Routine. That is deliberate, not
# duplicated work: the Routine builds against its own container, this builds
# the branch merged onto current main. A post that builds in isolation can
# still break once other commits land alongside it, and this is the gate that
# catches it. If the build fails nothing reaches production.

on:
  push:
    branches:
      - "blog/auto-**"

concurrency:
  # Two firings should never race to publish into main.
  group: blog-auto-merge
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # No `set -e`: the PR path is allowed to fail and fall through.
          set -uo pipefail
          TITLE=$(git log -1 --pretty=%s)

          # Preferred path — a PR, for the audit trail and a revertable unit.
          #
          # This needs Settings > Actions > General > Workflow permissions >
          # "Allow GitHub Actions to create and approve pull requests", which
          # is OFF by default. Without it the API returns:
          #   GitHub Actions is not permitted to create or approve pull requests
          EXISTING=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            echo "Reusing open PR: $EXISTING"
            URL="$EXISTING"
          else
            URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$TITLE" \
              --body "Automated blog post from the daily Routine. The build passed on this branch merged onto current \`main\`. Auto-merged by \`.github/workflows/blog-auto-merge.yml\`." 2>/dev/null) || URL=""
          fi

          if [ -n "$URL" ]; then
            echo "Merging $URL"
            if gh pr merge "$URL" --merge --delete-branch; then
              echo "Published via PR. Vercel will deploy from main."
              exit 0
            fi
            echo "::warning::PR merge failed; falling back to a direct merge."
          else
            echo "::warning::Could not open a PR — Actions likely lacks PR permission. Falling back to a direct merge so the post still publishes."
          fi

          # Fallback. A repository settings toggle must not be the reason a
          # finished, build-verified post fails to reach production.
          set -e
          git config user.name "AI Blogger Bot"
          git config user.email "ai-blogger@cyprustattoo.ink"
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff "origin/$BRANCH" -m "$TITLE"
          git push origin main
          git push origin --delete "$BRANCH"
          echo "Published via direct merge. Vercel will deploy from main."

      - name: Report failure
        if: failure()
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "::error::Blog post on '$BRANCH' did not publish."
          echo "The branch is left in place with its commit intact — inspect the"
          echo "failing step above, fix forward, and re-push to retry."
