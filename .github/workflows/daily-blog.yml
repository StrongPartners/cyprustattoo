name: AI Daily Blogger (yedek)

# Otomatik zamanlama DEVRE DIŞI.
#
# Günlük blog üretimi artık Claude Code Routine'i ile yapılıyor
# (trig_01UeRoipxPiCuuhjirqwb5Wk, 6 saatte bir: 00/06/12/18 UTC).
# Routine kendi oturumunda yazıyı üretir, `npm run build` ile doğrular
# ve main'e push eder — ayrı bir LLM API anahtarı gerekmez.
#
# Bu workflow yedek olarak duruyor: scripts/generate-blog.mjs Anthropic
# API'sini doğrudan çağırır ve ANTHROPIC_API_KEY secret'ı ister.
# Elle tetiklemek için: Actions > AI Daily Blogger (yedek) > Run workflow
#
# Zamanlamayı geri açmak istersen aşağıdaki schedule bloğunun yorumunu kaldır
# ve Routine'i devre dışı bırak — ikisi aynı anda çalışırsa main'de
# push çakışması ve mükerrer içerik oluşur.
#
#  schedule:
#    - cron: "0 0,6,12,18 * * *"

on:
  workflow_dispatch: # Sadece manuel çalıştırma
    inputs:
      post_count:
        description: 'Number of posts to generate'
        required: true
        default: '1'
        type: string

jobs:
  write-and-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # To push the new blog post
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate AI Blog Post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POST_COUNT: ${{ github.event.inputs.post_count || '1' }}
        run: node scripts/generate-blog.mjs

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AI Blogger Bot"
          git config --global user.email "ai-blogger@cyprustattoo.ink"
          git add src/data/blog-posts.ts
          git commit -m "feat: auto-generate daily blog post" || echo "No changes to commit"
          git push origin main
